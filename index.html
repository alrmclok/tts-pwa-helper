<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <title>Mimi - helper or idk</title>
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#f6f4fb" />
    <link rel="icon" href="icon-192.png" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Mimi</h1>
      <button id="openSettings" class="ghost iconbtn" aria-label="Settings">
        <span class="icon i-settings"></span>
      </button>
    </header>

    <main>
      <div class="composer">
        <textarea
          id="text"
          rows="3"
          placeholder="Type here, or tap a phrase below"
        ></textarea>
        <button id="clear" class="ghost small">Clear</button>
      </div>
      <div id="phrases"></div>
    </main>

    <footer>
      <button id="speak" class="btn speak">
        <span class="icon i-speak"></span><span class="lbl">Speak</span>
      </button>
      <button id="view" class="btn view">
        <span class="icon i-view"></span><span class="lbl">View</span>
      </button>
    </footer>

    <section id="viewer" hidden>
      <div id="stage">
        <div id="viewBox"><div id="vt"></div></div>
        <button id="closeView" aria-label="Close view"></button>
      </div>
    </section>

    <section id="settings" hidden>
      <div class="sethead">
        <h2>Settings</h2>
        <button id="done" class="pill">Done</button>
      </div>

      <div class="card">
        <h3>Appearance</h3>
        <div class="field">
          Theme
          <div id="themeCur" class="themecur"></div>
        </div>
      </div>

      <div class="card">
        <h3>Quick phrases</h3>
        <label>
          <textarea id="phraseEdit" rows="10" spellcheck="false"></textarea>
          <span class="hint"
            >One phrase per line. Start a line with # for a section
            heading.</span
          >
        </label>
      </div>

      <div class="card">
        <h3>Voice</h3>
        <div class="field">
          Voice
          <button id="voiceCur" class="pick"></button>
        </div>
        <label>
          <span class="row">Speed <output id="rateO"></output></span>
          <input type="range" id="rate" min="0.5" max="2" step="0.1" />
        </label>
        <label>
          <span class="row">Pitch <output id="pitchO"></output></span>
          <input type="range" id="pitch" min="0" max="2" step="0.1" />
        </label>
        <label>
          <span class="row">Volume <output id="volumeO"></output></span>
          <input type="range" id="volume" min="0" max="1" step="0.05" />
        </label>
        <button id="test" class="ghost testbtn">
          <span class="icon i-speak"></span>Test voice
        </button>
      </div>

      <div class="card">
        <h3>Advanced</h3>
        <label class="check switch">
          <span
            >Use CSS rotation instead of native landscape lock
            <span class="hint"
              >Turn this on if the screen doesn't rotate properly.</span
            >
          </span>
          <input type="checkbox" id="cssRotate" />
        </label>
      </div>
    </section>

    <section id="themePicker" hidden>
      <div class="tpanel" role="dialog" aria-label="Choose theme">
        <h2>Choose theme</h2>
        <div id="themes" class="themes"></div>
        <button id="themeClose" class="ghost">Close</button>
      </div>
    </section>

    <section id="voicePicker" hidden>
      <div class="tpanel" role="dialog" aria-label="Choose voice">
        <h2>Choose voice</h2>
        <div id="voices" class="vlist" role="radiogroup"></div>
        <button id="voiceClose" class="ghost">Close</button>
      </div>
    </section>

    <script src="app.js"></script>
  </body>
</html>
